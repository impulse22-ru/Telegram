version: "3.9"

x-env: &env
  POSTGRES_USER: tg
  POSTGRES_PASSWORD: tg
  POSTGRES_DB: tiktok

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: *env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tg -d tiktok"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Локальный Bot API сервер — снимает лимит 50 МБ (upload до 2 ГБ).
  # Требует ACCESS_HASH и API ID с my.telegram.org (см. .env.example).
  bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?set TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?set TELEGRAM_API_HASH}
    ports:
      - "8081:8081"
    volumes:
      - botapi:/var/lib/telegram-bot-api
    command: --local --http-port=8081 --dir=/var/lib/telegram-bot-api

  migrate:
    image: postgres:16-alpine
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: tg
      PGDATABASE: tiktok
      PGHOST: postgres
      PGUSER: tg
    entrypoint: ["sh","-c","sleep 1 && for f in /migrations/*.sql; do echo Applying $$f; psql -f $$f; done"]
    volumes:
      - ./migrations:/migrations

  api:
    build:
      context: .
      target: runtime
    command: [ "api" ]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-prod}
      HTTP_PORT: "8080"
      PG_DSN: postgres://tg:tg@postgres:5432/tiktok?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-720h}
      BOT_API_BASE: http://bot-api:8081
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN}
    ports:
      - "8080:8080"
    volumes:
      - appdata:/data

  relay:
    build:
      context: .
      target: runtime
    command: [ "relay" ]
    restart: unless-stopped
    environment:
      RELAY_PORT: "8082"
      RELAY_CACHE_DIR: /data/media_cache
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN}
      BOT_API_BASE: http://bot-api:8081
    ports:
      - "8082:8082"
    volumes:
      - appdata:/data

  worker:
    build:
      context: .
      target: runtime
    command: [ "worker" ]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-prod}
      PG_DSN: postgres://tg:tg@postgres:5432/tiktok?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      BOT_API_BASE: http://bot-api:8081
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN}
      FEED_CHAT_ID: ${FEED_CHAT_ID:?set FEED_CHAT_ID}

  # ---------- Мониторинг (этап: prometheus + grafana) ----------

  prometheus:
    image: prom/prometheus:v2.52.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    depends_on:
      api:
        condition: service_started
      relay:
        condition: service_started

  grafana:
    image: grafana/grafana:11.0.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Авто-провижининг датасорса Prometheus и дашборда TG Cloud.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./monitoring/grafana/dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml:ro
      - ./monitoring/grafana/tgcloud.json:/var/lib/grafana/dashboards/tgcloud.json:ro
      - grafanadata:/var/lib/grafana

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://tg:tg@postgres:5432/tiktok?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy

  # ---------- Резервное копирование ----------
  # Каждые 6 часов pg_dump -Fc в ./backups, retention 14 дней.

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: tg
      PGPASSWORD: tg
      PGDATABASE: tiktok
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts:ro
    entrypoint: [ "sh", "-c", "while true; do /scripts/backup.sh; sleep 6h; done" ]

volumes:
  pgdata:
  redisdata:
  botapi:
  appdata:
  promdata:
  grafanadata: